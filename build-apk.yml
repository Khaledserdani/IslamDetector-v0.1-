name: Build IslamDetector v0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -o IslamDetector-v0.1-project.zip -d build-src
      - name: Build debug APK
        working-directory: build-src/IslamDetector-v0.1-project
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-v0.1-debug-apk
          path: build-src/IslamDetector-v0.1-project/app/build/outputs/apk/debug/app-debug.apk
